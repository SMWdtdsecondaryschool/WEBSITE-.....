/* ---------- label de-collision ----------
   Each label tries positions around its dot (top, right, left, bottom, diagonals, then farther out
   with a thin leader line) and takes the first that does not overlap another label or dot.
   The active site is placed first; each label prefers its previous spot so labels don't jump while the globe turns. */
const LAB_GAP=4, DOT_R=10, LAB_OFF=13;
function labelCandidates(w,h){
  const c=[
    [-w/2,-h-LAB_OFF],            // 0 top (default)
    [LAB_OFF,-h/2],               // 1 right
    [-w-LAB_OFF,-h/2],            // 2 left
    [-w/2,LAB_OFF],               // 3 bottom
    [LAB_OFF-4,-h-LAB_OFF+4],     // 4 top-right
    [-w-LAB_OFF+4,-h-LAB_OFF+4],  // 5 top-left
    [LAB_OFF-4,LAB_OFF-4],        // 6 bottom-right
    [-w-LAB_OFF+4,LAB_OFF-4]      // 7 bottom-left
  ];
  for(let k=1;k<=3;k++){          // 8+ farther away -> leader line is drawn
    const d=k*(h+LAB_GAP+2);
    c.push([-w/2,-h-LAB_OFF-d],[-w/2,LAB_OFF+d],[LAB_OFF+12*k,-h/2-d],[LAB_OFF+12*k,-h/2+d],[-w-LAB_OFF-12*k,-h/2-d],[-w-LAB_OFF-12*k,-h/2+d]);
  }

}
const ovl=(a,b,g)=>Math.max(0,Math.min(a.x+a.w+g,b.x+b.w)-Math.max(a.x-g,b.x))*Math.max(0,Math.min(a.y+a.h+g,b.y+b.h)-Math.max(a.y-g,b.y));
function layoutLabels(list,W,H){
  if(!list.length) return;
  list.forEach(o=>{
    const lab=o.s._m.querySelector('.lab');
    if(!o.s._lw){ o.s._lw=lab.offsetWidth; o.s._lh=lab.offsetHeight; }
    o.lab=lab;
  });
  const dots=list.map(o=>({x:o.x-DOT_R,y:o.y-DOT_R,w:DOT_R*2,h:DOT_R*2,s:o.s}));
  const placed=[];
  list.sort((a,b)=>((b.s===current)-(a.s===current))||(a.y-b.y));
  list.forEach(o=>{
    const lw=o.s._lw, lh=o.s._lh, cand=labelCandidates(lw,lh);
    const order=[...cand.keys()];
    if(o.s._li>=0&&o.s._li<cand.length){ order.splice(order.indexOf(o.s._li),1); order.unshift(o.s._li); }
    let best=-1, bestScore=Infinity;
    for(const i of order){
      const r={x:o.x+cand[i][0],y:o.y+cand[i][1],w:lw,h:lh};
      let sc=0;
      placed.forEach(p=>sc+=ovl(r,p,LAB_GAP));
      dots.forEach(d=>{ if(d.s!==o.s) sc+=ovl(r,d,2)*2; });
      if(r.x<4) sc+=(4-r.x)*lh; if(r.x+lw>W-4) sc+=(r.x+lw-W+4)*lh;   // keep inside the screen
      if(r.y<4) sc+=(4-r.y)*lw; if(r.y+lh>H-4) sc+=(r.y+lh-H+4)*lw;
      if(i>=8) sc+=1;                                                // small cost for being far away
      if(sc<bestScore){ bestScore=sc; best=i; }
      if(sc===0) break;
    }
    o.s._li=best;
    const [dx,dy]=cand[best];
    placed.push({x:o.x+dx,y:o.y+dy,w:lw,h:lh});
    o.lab.style.transform=`translate(${14+dx}px,${14+dy}px)`;
    o.s._m.style.zIndex=o.s===current?23:(best>=8?21:20);
    // leader line from the dot to the nearest edge of a far label
    const lead=o.s._m.querySelector('.lead');
    if(best>=8){
      const tx=Math.max(dx,Math.min(0,dx+lw)), ty=Math.max(dy,Math.min(0,dy+lh));
      const len=Math.hypot(tx,ty), ang=Math.atan2(ty,tx);
      lead.style.display='block'; lead.style.width=`${Math.max(0,len-6)}px`;
      lead.style.transform=`rotate(${ang}rad) translateX(6px)`;
    } else lead.style.display='none';
  });
}

/* ---------- camera fly: arcs around the globe (no flying through it), aims at the ROTATED globe ---------- */
let flyAnim=null;
function cancelFly(){ if(flyAnim){cancelAnimationFrame(flyAnim);flyAnim=null;} }
function flyTo(lat,lon){
  cancelFly();
  const camLat=Math.max(-70,Math.min(70,lat));                 // look at polar sites obliquely
  const endDir=latLonToVec(camLat,lon,1).applyQuaternion(globe.quaternion).normalize();
  const startDir=camera.position.clone().normalize();
  const d0=camera.position.length(), d1=isPhone()?4.4:Math.max(3.0,fitDistance());
  const q=new THREE.Quaternion().setFromUnitVectors(startDir,endDir), qi=new THREE.Quaternion();
  if(reduceMotion){camera.position.copy(endDir.multiplyScalar(d1));return;}
  const t0=performance.now();
  const step=t=>{
    const k=Math.min(1,(t-t0)/1200), e=1-Math.pow(1-k,3);
    qi.identity().slerp(q,e);
    camera.position.copy(startDir).applyQuaternion(qi).multiplyScalar(d0+(d1-d0)*e);
    flyAnim = k<1 ? requestAnimationFrame(step) : null;
  };
  flyAnim=requestAnimationFrame(step);
}
